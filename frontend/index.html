<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hotel Management System</title><link rel="stylesheet" href="styles.css"></head>
<body><header><h1>Hotel Management System</h1><nav><button data-view="rooms">Rooms</button><button data-view="login" id="loginBtn">Login</button><button data-view="bookings">My Bookings</button><button data-view="admin" id="adminBtn" hidden>Admin</button><button id="logoutBtn" hidden>Logout</button></nav></header>
<main><div id="alert"></div><section id="roomsView"><div class="hero"><h2>Find Your Perfect Stay</h2><p>Browse rooms and make a reservation.</p></div><label><input type="checkbox" id="availableOnly"> Show available rooms only</label><div id="rooms" class="grid"></div></section>
<section id="loginView" hidden><div class="card"><h2>Login</h2><form id="loginForm"><input id="username" placeholder="Username" required><input id="password" type="password" placeholder="Password" required><button>Login</button></form><hr><h2>Register</h2><form id="registerForm"><input id="firstName" placeholder="First name" required><input id="lastName" placeholder="Last name" required><input id="regUsername" placeholder="Username" required><input id="email" type="email" placeholder="Email" required><input id="phone" placeholder="Phone"><input id="regPassword" type="password" placeholder="Password" required><button>Register</button></form></div></section>
<section id="bookingsView" hidden><div class="card"><h2>My Bookings</h2><div id="bookings"></div></div></section>
<section id="adminView" hidden><div class="card"><h2>Admin</h2><div id="admin"></div></div></section></main>
<dialog id="bookingDialog"><form method="dialog" id="bookingForm"><h2>Book room</h2><input type="hidden" id="roomId"><input id="checkIn" type="date" required><input id="checkOut" type="date" required><button>Confirm booking</button><button type="button" id="closeDialog">Cancel</button></form></dialog>
<script src="app.js"></script></body></html>
